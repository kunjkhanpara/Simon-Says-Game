<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="container">
        <h1>Simon Says</h1>
        <h2>Press Any Key to Start</h2>

        <div class="btn-container">
            <div class="btn red" data-color="red"></div>
            <div class="btn blue" data-color="blue"></div>
            <div class="btn green" data-color="green"></div>
            <div class="btn purple" data-color="purple"></div>
        </div>

        <div class="rules">
            <h3>How to Play</h3>
            <ul>
                <li>Press any key to start the game.</li>
                <li>Watch the sequence of lights and sounds.</li>
                <li>Click the buttons in the same order.</li>
                <li>Each round adds a new color to the sequence.</li>
                <li>If you make a mistake, the game restarts!</li>
            </ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
